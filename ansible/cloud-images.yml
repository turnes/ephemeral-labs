---
# Download Ubuntu cloud images into the elab-images storage pool as versioned base volumes:
#   <name>-<serial>.qcow2, e.g. ubuntu-26.04-20260927.qcow2
# serial "current" resolves to the build behind <base_url>/current/ (once per run, same for every host);
# the image is then fetched from the immutable <base_url>/<serial>/ directory and checksum-verified.
# Terraform pins a specific volume name, so new builds never change existing labs.
# Existing volumes are never replaced (lab disks use them as backing files). Delete old ones
# once no lab uses them:  virsh vol-delete --pool elab-images ubuntu-26.04-<serial>.qcow2
# Run after storage-pool.yml.
# Usage (from the project root; ansible.cfg points at inventory.yml):
#   ansible-playbook ansible/cloud-images.yml -K
- name: Download cloud images
  hosts: kvm_hosts
  become: true

  vars:
    elab_image_pool_name: elab-images
    elab_image_pool_path: /var/lib/libvirt/elab/images
    elab_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    elab_cloud_images:
      - name: ubuntu-26.04
        base_url: https://cloud-images.ubuntu.com/resolute
        file: resolute-server-cloudimg-{{ elab_arch }}.img
        serial: current  # or pin a build, e.g. 20260927

  tasks:
    - name: Check the image pool exists
      ansible.builtin.command: virsh pool-info {{ elab_image_pool_name }}
      register: elab_pool_info
      changed_when: false
      failed_when: false

    - name: Fail if the image pool is missing
      ansible.builtin.fail:
        msg: "Pool {{ elab_image_pool_name }} not found on {{ inventory_hostname }}; run ansible/storage-pool.yml first."
      when: elab_pool_info.rc != 0

    - name: Resolve current build serials
      ansible.builtin.uri:
        url: "{{ item.base_url }}/current/unpacked/build-info.txt"
        return_content: true
      loop: "{{ elab_cloud_images }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.serial | default('current') == 'current'
      run_once: true
      register: elab_build_info

    - name: Pin each image to a serial
      ansible.builtin.set_fact:
        elab_images: >-
          {{ elab_images | default([]) + [item.item | combine({
               'serial': (item.content | regex_search('serial=(\S+)', '\1') | first)
                         if item.content is defined else item.item.serial | string
             })] }}
      loop: "{{ elab_build_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Check serials look like builds
      ansible.builtin.assert:
        that: item.serial is match('^[0-9]{8}(\.[0-9]+)?$')
        fail_msg: "{{ item.name }}: unexpected serial '{{ item.serial }}'"
        quiet: true
      loop: "{{ elab_images }}"
      loop_control:
        label: "{{ item.name }}-{{ item.serial }}"

    - name: Check for existing volumes
      ansible.builtin.stat:
        path: "{{ elab_image_pool_path }}/{{ item.name }}-{{ item.serial }}.qcow2"
        get_checksum: false
      loop: "{{ elab_images }}"
      loop_control:
        label: "{{ item.name }}-{{ item.serial }}"
      register: elab_image_stat

    - name: Download images
      ansible.builtin.get_url:
        url: "{{ item.item.base_url }}/{{ item.item.serial }}/{{ item.item.file }}"
        dest: "{{ elab_image_pool_path }}/{{ item.item.name }}-{{ item.item.serial }}.qcow2"
        checksum: "sha256:{{ item.item.base_url }}/{{ item.item.serial }}/SHA256SUMS"
        owner: root
        group: root
        mode: "0644"
        timeout: 600
      loop: "{{ elab_image_stat.results }}"
      loop_control:
        label: "{{ item.item.name }}-{{ item.item.serial }}"
      when: not item.stat.exists
      register: elab_image_download

    - name: Refresh the pool so libvirt sees new volumes
      ansible.builtin.command: virsh pool-refresh {{ elab_image_pool_name }}
      when: elab_image_download is changed
      changed_when: true

    - name: List volumes
      ansible.builtin.command: virsh vol-list --pool {{ elab_image_pool_name }} --details
      register: elab_vol_list
      changed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg: "{{ ['Pinned: ' ~ (elab_images | map(attribute='name') | zip(elab_images | map(attribute='serial')) | map('join', '-') | map('regex_replace', '$', '.qcow2') | join(', '))] + elab_vol_list.stdout_lines }}"
