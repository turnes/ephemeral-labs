---
# Mirror the repository (repo.yml) to /opt/elab on every other KVM host.
# A systemd timer pulls rsync://<repo>/elab/ every 5 minutes. One-way and without --delete:
# files removed from the repository stay on the mirrors until removed there.
# Authenticates as "elab" with vault_rsync_password (inventory/group_vars/all/vault.yml).
# Sync now on a host:  sudo systemctl start elab-mirror.service
# Sync now on all mirrors (from ansible/; returns when every mirror is done):
#   ansible 'kvm_hosts:!elab_repo' -b -K -m systemd_service -a 'name=elab-mirror.service state=started'
# Run after repo.yml.
# Usage (from the ansible/ directory; ansible.cfg points at inventory/hosts.yml):
#   ansible-playbook playbooks/repo-mirror.yml -K
- name: Mirror the file repository
  hosts: kvm_hosts:!elab_repo
  become: true

  vars:
    elab_repo_host: "{{ groups['elab_repo'] | default([]) | first | default('') }}"
    elab_repo_address: "{{ hostvars[elab_repo_host]['ansible_host'] | default(elab_repo_host) }}"
    elab_repo_module: elab
    elab_repo_user: elab
    elab_mirror_password_file: /etc/elab-mirror.secret
    elab_repo_root: /opt/elab
    elab_mirror_interval: 5min

  tasks:
    - name: Fail if no repository host is defined
      ansible.builtin.fail:
        msg: "Add the repository host to the elab_repo group in inventory/hosts.yml and run playbooks/repo.yml."
      when: elab_repo_host == ''

    - name: Check the rsync password is in the vault
      ansible.builtin.assert:
        that: vault_rsync_password is defined and vault_rsync_password | length >= 16
        fail_msg: "vault_rsync_password is missing; run bootstrap/vault-init.sh or add it with ansible-vault edit inventory/group_vars/all/vault.yml"
        quiet: true

    - name: Install rsync
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create mirror directory
      ansible.builtin.file:
        path: "{{ elab_repo_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install mirror password file
      ansible.builtin.copy:
        dest: "{{ elab_mirror_password_file }}"
        content: "{{ vault_rsync_password }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install mirror service
      ansible.builtin.copy:
        dest: /etc/systemd/system/elab-mirror.service
        mode: "0644"
        content: |
          # Managed by ansible/playbooks/repo-mirror.yml
          [Unit]
          Description=Mirror ephemeral-labs repository from {{ elab_repo_host }}
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          # --delay-updates: new files appear only once complete
          ExecStart=/usr/bin/rsync -a --partial --delay-updates --password-file={{ elab_mirror_password_file }} rsync://{{ elab_repo_user }}@{{ elab_repo_address }}/{{ elab_repo_module }}/ {{ elab_repo_root }}/

    - name: Install mirror timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/elab-mirror.timer
        mode: "0644"
        content: |
          # Managed by ansible/playbooks/repo-mirror.yml
          [Unit]
          Description=Mirror ephemeral-labs repository every {{ elab_mirror_interval }}

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec={{ elab_mirror_interval }}
          RandomizedDelaySec=30

          [Install]
          WantedBy=timers.target

    - name: Enable mirror timer
      ansible.builtin.systemd_service:
        name: elab-mirror.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Sync now
      ansible.builtin.systemd_service:
        name: elab-mirror.service
        state: started
      changed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg: "{{ elab_repo_root }} mirrors rsync://{{ elab_repo_user }}@{{ elab_repo_address }}/{{ elab_repo_module }}/ every {{ elab_mirror_interval }}"
